<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>StudyFlow — Your personal deep work engine for focused study</title>
    <meta
      name="description"
      content="StudyFlow is a distraction-free focus timer and study tracker. Run deep-work sessions, organize them by subject, and turn streaks and analytics into real, focused progress."
    />
    <meta name="theme-color" content="#2b4bee" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StudyFlow — Your personal deep work engine" />
    <meta
      property="og:description"
      content="A distraction-free focus timer and study tracker. Run deep-work sessions, organize by subject, and watch streaks and analytics reveal how your hours add up."
    />
    <meta property="og:site_name" content="StudyFlow" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyFlow — Your personal deep work engine" />
    <meta
      name="twitter:description"
      content="A distraction-free focus timer and study tracker for deep, measurable study sessions."
    />
    <script>
      // Apply theme before any paint so dark-mode users don't see a white
      // flash while React mounts and the ThemeProvider's effect runs. Keep
      // this in sync with src/context/ThemeContext.jsx and the bg-light
      // tokens in src/styles/variables.css.
      (function () {
        try {
          var saved = localStorage.getItem('studyflow-theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-bs-theme', theme);
          root.style.colorScheme = theme;
          root.style.backgroundColor = theme === 'dark' ? '#0e0e10' : '#f5f5f7';
        } catch (e) {
          /* localStorage may be blocked — fall through to CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
